<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seller dashboard | Kicks &amp; Cuffs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="admin">
<div id="site-header"></div>

<main class="wrap">
  <div class="page-head"><h1 data-split>Seller dashboard</h1></div>
  <div class="banner">Demo dashboard. Orders and stock are saved in this browser only. Real seller login and shared data come with the server step.</div>

  <div class="stats" id="stats"></div>

  <div class="tabs" role="tablist">
    <button class="chip pill on" role="tab" data-tab="orders" aria-pressed="true">Orders</button>
    <button class="chip pill" role="tab" data-tab="stock" aria-pressed="false">Stock by size</button>
  </div>

  <section class="panel" id="tab-orders"></section>
  <section class="panel" id="tab-stock" hidden></section>

  <p style="margin-top:20px;display:flex;gap:12px;flex-wrap:wrap">
    <button class="btn" id="seed">Add sample orders</button>
    <button class="btn" id="reset">Reset all demo data</button>
  </p>
</main>

<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
