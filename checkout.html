<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout | Kicks &amp; Cuffs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="checkout">
<div id="site-header"></div>

<main class="wrap">
  <div class="page-head"><h1 data-split>Checkout</h1></div>
  <div class="two">
    <form id="co-form" novalidate>
      <fieldset class="fs" style="margin-top:8px">
        <legend>Your details</legend>
        <div class="fields">
          <div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required><div class="err" data-err="name"></div></div>
          <div class="two-col">
            <div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="0801 234 5678" required><div class="err" data-err="phone"></div></div>
            <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><div class="err" data-err="email"></div></div>
          </div>
        </div>
      </fieldset>

      <fieldset class="fs">
        <legend>Delivery address</legend>
        <div class="fields">
          <div class="field"><label for="address">Street address</label><input id="address" name="address" autocomplete="street-address" required><div class="err" data-err="address"></div></div>
          <div class="two-col">
            <div class="field"><label for="city">City or town</label><input id="city" name="city" autocomplete="address-level2" required><div class="err" data-err="city"></div></div>
            <div class="field"><label for="zone">Delivery area</label><select id="zone" name="zone" required></select><div class="err" data-err="zone"></div></div>
          </div>
          <p class="muted" id="zone-eta" style="font-size:14px"></p>
        </div>
      </fieldset>

      <fieldset class="fs">
        <legend>How do you want to pay?</legend>
        <label class="opt-card"><input type="radio" name="method" value="card" checked><span><b>Card</b><small>Visa, Mastercard or Verve</small></span></label>
        <label class="opt-card"><input type="radio" name="method" value="transfer"><span><b>Bank transfer</b><small>Pay to a one time account number</small></span></label>
        <label class="opt-card"><input type="radio" name="method" value="ussd"><span><b>USSD</b><small>Dial a code from your phone</small></span></label>
        <p class="muted" style="font-size:13px;margin-top:6px">You pay in a secure window. We confirm your payment automatically, so there is nothing to send us.</p>
      </fieldset>
    </form>

    <aside class="summary" id="co-summary"></aside>
  </div>
</main>

<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/payment.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
