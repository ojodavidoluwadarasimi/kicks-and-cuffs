<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop all shoes | Kicks &amp; Cuffs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="shop">
<div id="site-header"></div>

<main class="wrap">
  <div class="page-head">
    <h1 id="shop-title" data-split>All shoes</h1>
    <p id="shop-count" class="reveal" style="--d:.3s"></p>
  </div>

  <div class="filters">
    <div class="row" id="cat-pills"></div>
    <div class="row">
      <div class="chips" id="size-chips" style="flex:1 1 360px;max-width:520px"></div>
    </div>
    <div class="row">
      <button class="check" id="stock-only" aria-pressed="false"><span class="box" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Only what is in stock in my size</button>
      <label class="sr-only" for="sort">Sort shoes</label>
      <select class="sel" id="sort">
        <option value="new">Newest first</option>
        <option value="low">Price: low to high</option>
        <option value="high">Price: high to low</option>
      </select>
    </div>
  </div>

  <div class="grid" id="shop-grid" style="margin-top:20px"></div>
  <div id="shop-empty" class="empty" hidden></div>
</main>

<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/api.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
